version: "3"

tasks:
  build:
    desc: Build everything
    cmds:
      - bazel build //...

  just-run:
    desc: Just run main
    cmds:
      - ./bazel-bin/aoc {{.CLI_ARGS}}

  run:
    desc: Build and run main
    cmds:
      - task: build
      - task: just-run

  format:
    desc: Run clang-format
    cmds:
      - find . -not -path "./bazel-*" \( -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cpp" \) | xargs clang-format -i
